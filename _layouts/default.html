<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">
    <meta name="author" content="{{ site.title }}">
    <link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="{{ '/feed.xml' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
    {% include analytics.html %}
</head>

<body>

    <header>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <nav>
            <a href="{{ '/' | relative_url }}">Home</a>
            <a href="{{ '/blog.html' | relative_url }}">Blog</a>
            <a href="https://github.com/WickedStereo" target="_blank" rel="noopener">GitHub</a>
            <a href="https://www.linkedin.com/in/anish-miryala/" target="_blank" rel="noopener">LinkedIn</a>
            <a href="mailto:am12553@nyu.edu">Email</a>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. Built with Jekyll.</p>
        <p style="font-size: 0.85rem; color: #999;">Last updated: {{ site.time | date: '%B %d, %Y' }} · <a
                href="{{ '/feed.xml' | relative_url }}">RSS Feed</a></p>
    </footer>

</body>

</html>
