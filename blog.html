---
layout: default
title: Blog
---

<h2>Articles</h2>
<p style="color: #666; margin-bottom: 2rem;">Thoughts on hardware design, computer architecture, and silicon.</p>

<ul class="post-list">
    {% for post in site.posts %}
    <li>
        <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span>
        <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
    </li>
    {% endfor %}
</ul>
